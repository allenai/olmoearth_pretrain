# Canonical model/task config for the PLANTEUR eval dataset (crop-type
# segmentation over the French overseas territories; benchmark release at
# https://huggingface.co/datasets/allenai/planteur-benchmark). Consumed by
# studio_ingest and the eval-time dataset builder
# (olmoearth_pretrain/evals/datasets/rslearn_builder.py); only the `data`
# block is read. Inputs are the twelve calendar-2019 monthly mosaics, with
# band orders matching the OlmoEarth modality band_order. Windows carry the
# default 1896/411/443 split in the eval_split tag.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis2_drom_2019
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
          - sentinel2_l2a_mo06
          - sentinel2_l2a_mo07
          - sentinel2_l2a_mo08
          - sentinel2_l2a_mo09
          - sentinel2_l2a_mo10
          - sentinel2_l2a_mo11
          - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel1_mo01
          - sentinel1_mo02
          - sentinel1_mo03
          - sentinel1_mo04
          - sentinel1_mo05
          - sentinel1_mo06
          - sentinel1_mo07
          - sentinel1_mo08
          - sentinel1_mo09
          - sentinel1_mo10
          - sentinel1_mo11
          - sentinel1_mo12
        load_all_layers: true
        bands:
          - vv
          - vh
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - class_id
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # The label layer stores the 26-class source taxonomy. The 8 benchmark
        # classes keep their ids 0-7; every crop outside the taxonomy maps to
        # 255 (void), which is masked out of loss and metrics.
        num_classes: 8
        nodata_value: 255
        class_id_mapping:
          0: 0
          1: 1
          12: 2
          16: 3
          19: 4
          20: 5
          21: 6
          23: 7
          2: 255
          3: 255
          4: 255
          5: 255
          6: 255
          7: 255
          8: 255
          9: 255
          10: 255
          11: 255
          13: 255
          14: 255
          15: 255
          17: 255
          18: 255
          22: 255
          24: 255
          25: 255
        enable_miou_metric: true
        class_names:
          - Background
          - Meadow
          - Fruits/vegetables/flowers
          - Orchard
          - Sugarcane
          - Banana
          - Pineapple
          - Tropical tuber
    batch_size: 8
    num_workers: 4
