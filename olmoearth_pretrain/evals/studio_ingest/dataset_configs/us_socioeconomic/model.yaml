# US socioeconomic eval (scripts/tools/build_us_socioeconomic_eval.py): 10,000
# population-weighted 128 x 128 CONUS tiles at 10 m with ACS 2020-2024 block-group
# labels, imagery = the twelve 2022 monthly S2 / S1 / Landsat layers copied from
# us_trees_year_aligned. Splits are 0.5 degree spatial blocks (window option "split").
#
# The probe target here is log_pop_density, the one label every window has. The
# all_evals task tiles each window into ws16 ps1 crops, mean-pools them back to one
# embedding per tile (pool_tiles) and also fits a ridge for log_income,
# log_home_value and log_pop_density from the same pass (tile_label_properties).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/us_socioeconomic
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel2_l2a_mo01
        - sentinel2_l2a_mo02
        - sentinel2_l2a_mo03
        - sentinel2_l2a_mo04
        - sentinel2_l2a_mo05
        - sentinel2_l2a_mo06
        - sentinel2_l2a_mo07
        - sentinel2_l2a_mo08
        - sentinel2_l2a_mo09
        - sentinel2_l2a_mo10
        - sentinel2_l2a_mo11
        - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo01
        - sentinel1_mo02
        - sentinel1_mo03
        - sentinel1_mo04
        - sentinel1_mo05
        - sentinel1_mo06
        - sentinel1_mo07
        - sentinel1_mo08
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
      landsat:
        data_type: raster
        dtype: FLOAT32
        layers:
        - landsat_mo01
        - landsat_mo02
        - landsat_mo03
        - landsat_mo04
        - landsat_mo05
        - landsat_mo06
        - landsat_mo07
        - landsat_mo08
        - landsat_mo09
        - landsat_mo10
        - landsat_mo11
        - landsat_mo12
        load_all_layers: true
        bands:
        - B8
        - B1
        - B2
        - B3
        - B4
        - B5
        - B6
        - B7
        - B9
        - B10
        - B11
        passthrough: true
        required: false
      targets:
        data_type: vector
        layers:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.regression.RegressionTask
            init_args:
              property_name: log_pop_density
              allow_invalid: true
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
