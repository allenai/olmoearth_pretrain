version: v2
budget: ai2/atec-olmoearth
description: OmniCloudMask sidecars for the new-maps Landsat-reflectance h5 (cdl_glo30_..., 1138828)
tasks:
- name: precompute_clouds_newmaps_refl
  image:
    beaker: petew/olmo-core-tch271cu128-2025-09-15
  command:
  - bash
  - -c
  - |
    set -euo pipefail

    # The h5 build we are computing clouds FOR. The cache is written to the sibling
    # cloud_masks_omnicloudmask path, which is exactly where default_cache_dir()
    # looks at training time. A cache is NOT transferable between h5 builds --
    # sidecars are keyed by raw h5 sample id and the builds are not index-aligned
    # (0/150 probed indices agreed between the old map set and this one), which is
    # why this job exists rather than reusing the complete old-map-set cache.
    R=/weka/dfive-default/helios/dataset
    H=h5py_data_w_missing_timesteps_zstd_3_128_x_4
    NEW=cdl_glo30_landsat_meta_canopy_height_openstreetmap_raster_sentinel1_sentinel2_l2a_worldcereal_worldcover
    H5_DIR="$R/osm_sampling_landsat_refl/$H/$NEW/1138828"
    CACHE="$R/osm_sampling_landsat_refl/cloud_masks_omnicloudmask/$NEW/1138828"

    # Offline OCM weights, pre-staged on weka: model weights are dataset-independent,
    # so the ones from the original precompute are reused. Avoids a HuggingFace fetch.
    export OCM_MODEL_DIR=$R/osm_sampling/cloud_masks_omnicloudmask/_ocm_weights

    echo "h5_dir: $H5_DIR"
    echo "cache:  $CACHE"
    test -d "$H5_DIR" || { echo "FATAL: h5_dir missing"; exit 1; }
    test -d "$OCM_MODEL_DIR" || { echo "FATAL: OCM weights missing"; exit 1; }
    echo "h5 files present: $(ls -1 "$H5_DIR" | head -1) ..."

    # Pinned checkout. cloud_mask_cache needs only numpy/h5py/hdf5plugin/omnicloudmask
    # (the latter three are lazy imports) and both package __init__ files are bare,
    # so a light pip install is enough -- no uv sync.
    conda install gh --channel conda-forge -y
    gh auth status
    gh repo clone allenai/olmoearth_pretrain /repo
    cd /repo
    git checkout bc31d9083f6e056fe1753cf267304793f073e652
    echo "code pinned at: $(git rev-parse HEAD)"
    pip install -q omnicloudmask h5py hdf5plugin einops numpy

    # WIDTH. OCM runs once per non-empty timestep PER SENSOR -- up to ~24 tiny
    # predict_from_array calls per sample, each on a (3,128,128) S2 array or a
    # (3,~43,~43) strided Landsat one. That makes this launch-latency and CPU/IO
    # bound (h5 open + zstd decompress + array prep), not compute bound, so one
    # process per GPU leaves the GPU idle most of the wall clock. Hence 3 processes
    # per GPU, overlapping one process's read with another's forward. 192 CPUs are
    # requested for them.
    #
    # NUM_SHARDS is the total across ALL jobs and must equal GPUS*PROCS_PER_GPU
    # times the number of jobs; SHARD_BASE is this job's first shard. To fan out
    # further, submit more copies with SHARD_BASE=24, 48, ... and NUM_SHARDS raised
    # to match. Shards are disjoint (ids = [i for i in range(n) if i % num_shards
    # == shard]), and even overlapping ones would only duplicate work, never corrupt:
    # every sample is compute-if-missing with an atomic temp+rename write. The whole
    # job is therefore idempotent and resumable -- resubmitting finishes the rest.
    GPUS=${GPUS:-8}
    PROCS_PER_GPU=${PROCS_PER_GPU:-3}
    SHARD_BASE=${SHARD_BASE:-0}
    NUM_SHARDS=${NUM_SHARDS:-$((GPUS * PROCS_PER_GPU))}
    echo "width: GPUS=$GPUS x PROCS_PER_GPU=$PROCS_PER_GPU, shards $SHARD_BASE..$((SHARD_BASE + GPUS*PROCS_PER_GPU - 1)) of $NUM_SHARDS"

    pids=()
    for g in $(seq 0 $((GPUS - 1))); do
      for r in $(seq 0 $((PROCS_PER_GPU - 1))); do
        shard=$((SHARD_BASE + r * GPUS + g))
        CUDA_VISIBLE_DEVICES="$g" PYTHONPATH=/repo \
          python -m olmoearth_pretrain.data.cloud_mask_cache \
            --h5_dir "$H5_DIR" --num_shards "$NUM_SHARDS" --shard "$shard" \
            > "/outputs/shard_$shard.log" 2>&1 &
        pids+=($!)
      done
    done
    rc=0
    for p in "${pids[@]}"; do wait "$p" || rc=1; done

    # Completeness is the thing to check before trusting any cloudmask run: a
    # PARTIAL cache silently disables the skip for the samples it misses, and the
    # training-side guard only catches a wholly absent or shard-less directory.
    n=$(find "$CACHE" -name 'sample_*.npz' | wc -l)
    echo "ALL SHARDS DONE (rc=$rc): $n / 1138828 npz written"
    for f in /outputs/shard_*.log; do echo "-- $f"; tail -n 2 "$f"; done
    test "$n" -eq 1138828 || { echo "INCOMPLETE -- rerun this job to resume"; exit 1; }
    echo "CACHE COMPLETE"
  result:
    path: /outputs
  resources:
    gpuCount: 8
    sharedMemory: 256 GiB
  context:
    priority: urgent
    preemptible: true
  constraints:
    cluster:
    - ai2/jupiter
    - ai2/ceres
  datasets:
  - mountPath: /weka/dfive-default
    source:
      weka: dfive-default
  envVars:
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: /etc/gcp_credentials.json
  - name: BEAKER_TOKEN
    secret: gabrielt_BEAKER_TOKEN
  - name: GITHUB_TOKEN
    secret: gabrielt_GITHUB_TOKEN
  - name: GCP_CREDENTIALS
    secret: HELIOS_GCP_CREDENTIALS
