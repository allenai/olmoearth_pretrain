# Data-only config for the FLUXNET flux-tower eval: relative GPP: 8-day mean GPP divided by the site's 95th percentile of it (unitless)
# from a 448-day ERA5-Land daily history (the window ends on the target period's
# last day). Only the `data:` section is consumed (rslearn_builder).
#
# Dataset: built by olmoearth_pretrain/dataset_creation/fluxnet (see its README).
# One window per (site, anchor date): the site's ERA5-Land cell, 1x1 in a WGS84
# 0.1 deg/px window; label = the target, a property of the vector `label` point.
# Splits are spatial (sites within 50 km share a split), tags written at creation.
# Registry entries pick the group (`eval` subset or `all`) and the split tags.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/rslearn-eai/datasets/fluxnet/rslearn_dataset
    inputs:
      era5_daily:
        data_type: raster
        layers:
        - era5_daily
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
        dtype: FLOAT32
      targets:
        data_type: vector
        layers:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.regression.RegressionTask
      init_args:
        property_name: "rgpp"
        allow_invalid: false
        metrics:
        - rmse
    batch_size: 64
    num_workers: 16
    # ERA5 normalization is handled by the OlmoEarth Normalizer
    # (Strategy.ZSCORE, computed.json); no rslearn Normalize transform here.
    train_config:
      groups:
      - eval
      tags:
        split: train
    val_config:
      groups:
      - eval
      tags:
        split: val
    test_config:
      groups:
      - eval
      tags:
        split: test
    predict_config:
      skip_targets: true
