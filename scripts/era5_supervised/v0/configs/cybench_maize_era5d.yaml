# Data-only config for CY-Bench maize yield regression via ERA5-Land daily inputs.
# Only the `data:` section is consumed by the eval builder
# (olmoearth_pretrain.evals.datasets.rslearn_builder); the rslearn model/trainer
# sections are intentionally omitted.
#
# Dataset: built by olmoearth_pretrain/dataset_creation/cybench (see its README).
# One window per (admin unit, harvest year): a 448-day ERA5-Land series ending at
# the WorldCereal crop-calendar end of season, aggregated over the admin polygon
# with crop-area-fraction weights (the same aggregation CY-Bench used for its own
# predictors), stored 1x1 in a WGS84 0.1 deg/px window. Label = yield in t/ha,
# a window-level RegressionTask on the vector `label` layer.
#
# Splits are harvest-year tags written at dataset creation: train <= 2017,
# val 2018-2019, test >= 2020 (CY-Bench itself is leave-one-year-out; see README).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/helios/dataset/cybench/rslearn_dataset
    inputs:
      era5_daily:
        data_type: raster
        layers:
        - era5_daily
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
        dtype: FLOAT32
      targets:
        data_type: vector
        layers:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.regression.RegressionTask
      init_args:
        property_name: "yield"
        allow_invalid: true
        metrics:
        - rmse
    batch_size: 64
    num_workers: 16
    # ERA5 normalization is handled by the OlmoEarth Normalizer
    # (Strategy.ZSCORE, computed.json); no rslearn Normalize transform here.
    train_config:
      groups:
      - maize
      tags:
        split: train
    val_config:
      groups:
      - maize
      tags:
        split: val
    test_config:
      groups:
      - maize
      tags:
        split: test
    predict_config:
      skip_targets: true
