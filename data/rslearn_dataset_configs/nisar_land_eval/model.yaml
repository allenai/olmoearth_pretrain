# NISAR land-cover eval (card t-7xgg82; scripts/create_nisar_land_eval.py in the session
# folder /weka/dfive-default/agent/favyen/2026-10-23-favyen-nisar-pretrain).
# 1,500 osm_sampling tiles held out from both NISAR pretraining selections, center 64x64
# at 10 m, four 30-day layers 2026-06-17..2026-10-15 (PROVISIONAL NISAR GCOV only exists
# from June 2026). Label: WorldCover 2021 remapped to 0..10 (255 = nodata).
# Every input is required, so all tasks see the same windows.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/helios/dataset_creation/nisar_land_eval
    inputs:
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
        required: true
      nisar_asc:
        data_type: raster
        dtype: FLOAT32
        layers:
        - nisar_asc_mo09
        - nisar_asc_mo10
        - nisar_asc_mo11
        - nisar_asc_mo12
        load_all_layers: true
        bands:
        - HHHH
        - HVHV
        passthrough: true
        required: true
      nisar_desc:
        data_type: raster
        dtype: FLOAT32
        layers:
        - nisar_desc_mo09
        - nisar_desc_mo10
        - nisar_desc_mo11
        - nisar_desc_mo12
        load_all_layers: true
        bands:
        - HHHH
        - HVHV
        passthrough: true
        required: true
      targets:
        data_type: raster
        layers:
        - label_raster
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 11
              nodata_value: 255
              metric_kwargs:
                average: macro
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
