# Model/task config for the PASTIS2 (France-DROM) eval dataset — the 12-monthly
# -mosaic twin at data/national_ds_monthly (see pastis2/config_monthly.json and
# make_monthly_windows.py). Mirrors data/rslearn_dataset_configs/pastis_rslearn/
# model.yaml, adapted for PASTIS2: 26 classes (PASTIS-18 + 7 tropical DROM incl.
# coffee=25), the class_id label band, and the DROM dataset path. Only the `data`
# block is read by studio_ingest / the eval-time rslearn_builder. Band orders
# match the OlmoEarth modality band_order so the eval normalizer sees the
# expected channels.
#
# To use with the olmoearth eval framework, place a copy at
#   olmoearth_pretrain/data/rslearn_dataset_configs/pastis2_drom/model.yaml
# and register the dataset via studio_ingest (see README / eval notes).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/piperw/dev/rslearn_projects/pastis2/data/national_ds_monthly
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
          - sentinel2_l2a_mo06
          - sentinel2_l2a_mo07
          - sentinel2_l2a_mo08
          - sentinel2_l2a_mo09
          - sentinel2_l2a_mo10
          - sentinel2_l2a_mo11
          - sentinel2_l2a_mo12
        load_all_layers: true
        # OlmoEarth S2 band order (matches pastis_rslearn); our mo layers carry
        # the same 3 zoom-tiered band-sets (B02-04,B08 / B05-07,B8A,B11,B12 / B01,B09).
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel1_mo01
          - sentinel1_mo02
          - sentinel1_mo03
          - sentinel1_mo04
          - sentinel1_mo05
          - sentinel1_mo06
          - sentinel1_mo07
          - sentinel1_mo08
          - sentinel1_mo09
          - sentinel1_mo10
          - sentinel1_mo11
          - sentinel1_mo12
        load_all_layers: true
        bands:
          - vv
          - vh
        passthrough: true
      # AEF (Google Satellite Embedding V1), 2019 annual embedding, single slot,
      # materialized into national_ds_monthly as the `aef` layer (64-band). The
      # olmoearth GSE modality is keyed `gse`, so this input is named `gse` but
      # reads our `aef` layer. Enables `--model=aef` on PASTIS2 with the SAME
      # splits as the OlmoEarth imagery eval.
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
          - aef
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      # Tessera v2 (large student) 128-d embedding, inferred per window into the
      # `tessera_v2` layer by pastis_tessera_v2.py. Named `tessera_v2` (the OlmoEarth
      # TESSERA_V2 modality key). Enables `--model=tessera_v2_precomputed` on PASTIS2
      # with the SAME splits as the OlmoEarth imagery / AEF evals. required: false so
      # it doesn't gate the imagery evals.
      tessera_v2:
        data_type: raster
        dtype: FLOAT32
        layers:
          - tessera_v2
        required: false
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - class_id
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # PASTIS2: class 0 = background (a real, evaluated class) + 25 crop
        # classes (1-18 PASTIS temperate + 19-25 tropical DROM incl. 25 coffee).
        # 255 is the label layer's nodata (no RPG coverage) -> masked to ignore.
        num_classes: 26
        nodata_value: 255
        enable_miou_metric: true
        enable_f1_metric: true
        # Per-class IoU/F1 so the rare tropical classes (vanilla, ylang, coffee)
        # are visible instead of drowned out by the mIoU average.
        report_metric_per_class: true
        class_names:
          - "Background"
          - "Meadow"
          - "Soft winter wheat"
          - "Corn"
          - "Winter barley"
          - "Winter rapeseed"
          - "Spring barley"
          - "Sunflower"
          - "Grapevine"
          - "Beet"
          - "Winter triticale"
          - "Winter durum wheat"
          - "Fruits/vegetables/flowers"
          - "Potatoes"
          - "Leguminous fodder"
          - "Soybeans"
          - "Orchard"
          - "Mixed cereal"
          - "Sorghum"
          - "Sugarcane"
          - "Banana"
          - "Pineapple"
          - "Vanilla"
          - "Tropical tuber"
          - "Ylang-ylang"
          - "Coffee/Cacao"
    batch_size: 8
    num_workers: 4
