# Eval-only model.yaml for olmoearth_pretrain registry ingestion.
# AEF-style task: each window has a single labeled center pixel (label_raster,
# nodata=255 elsewhere). Only the `data` block is consumed by ingest/eval.
#
# GENERATED SIBLING of us_trees -- same windows on disk, stricter input set.
# Tessera covers 44 894 / 45 382 us_trees windows (98.92%), below the 99%
# --min_coverage gate in wire_embedding_modalities.py, so `tessera` is NOT
# enabled on the us_trees entry itself: marking it required there would drop
# the 488 gap windows from EVERY eval on us_trees, including the OlmoEarth
# columns already recorded. Instead this entry requires both embedding
# products, so rslearn resolves one matched window set and OlmoEarth, AEF and
# Tessera are all scored on exactly the same windows. `us_trees` keeps the full
# 45 379 (gse-required) set; the two task families are deliberately NOT
# comparable across each other, which is why they carry different names.
#
# Regenerate with scripts/tools/build_matched_subset_eval_configs.py.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/rslearn-eai/datasets/olmoearth_evals/us_trees/
    inputs:
      tessera:
        data_type: raster
        dtype: FLOAT32
        layers:
          - tessera
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
          - gse
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      sentinel2_l2a:
        data_type: "raster"
        layers: ["sentinel2", "sentinel2.1", "sentinel2.2", "sentinel2.3", "sentinel2.4", "sentinel2.5", "sentinel2.6", "sentinel2.7", "sentinel2.8", "sentinel2.9", "sentinel2.10", "sentinel2.11"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        load_all_layers: true
        load_all_item_groups: false
      targets:
        data_type: "raster"
        layers: ["label_raster"]
        bands: ["label"]
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              # yucca, quercus, alnus, juniperus, prunus, betula, elaeagnus, ulmus,
              # pseudotsuga, sabal, thuja, juglans, ailanthus, maclura, gleditsia,
              # cornus, fagus, morus, magnolia, carya, abies, prosopis, pinus, picea,
              # asimina, diospyros, ilex, cercis, taxodium, salix, acer, tsuga,
              # sassafras, populus, amelanchier, liriodendron, aesculus, triadica,
              # liquidambar
              num_classes: 39
              nodata_value: 255
              metric_kwargs:
                average: "macro"
        input_mapping:
          eval_task:
            targets: "targets"
    batch_size: 8
    num_workers: 16
    default_config:
      transforms:
        - class_path: rslearn.train.transforms.pad.Pad
          init_args:
            mode: "center"
            size: 32
            image_selectors: ["sentinel2_l2a", "target/eval_task/classes", "target/eval_task/valid"]
