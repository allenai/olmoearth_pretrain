# Hand-written sibling of ethiopia_crops_year_aligned. NOT generated -- do not add
# this dataset to build_year_aligned_eval_configs.DATASETS, which rebuilds the
# sentinel2_l2a input unconditionally from MONTHLY_LAYERS and would reset it.
#
# Same windows, labels and eval_split tags as the parent (rsync'd, so identical by
# construction), same gse/tessera_v2 embedding layers, same S1/Landsat monthlies.
# The ONE difference is the S2 imagery: instead of twelve 30-day mosaics, this arm
# reads up to 36 INDIVIDUAL acquisitions spanning the calendar year, taken from the
# sentinel2_l2a_all fetch group tessera_v2_export materialized and attached by
# olmoearth_pretrain/evals/datasets/allscenes_export.py. Ethiopia's archive holds a
# median 71 acquisitions per window per year, so the monthly arm discards eleven
# looks in twelve; 36 is three times the monthly budget, evenly spaced in time.
#
# load_all_item_groups is what makes the variable length work: the layer carries one
# item group per acquisition and windows differ in how many they have, so the input
# names the LAYER and rslearn reads whatever groups exist. The eval collate pads each
# batch to its longest sample and marks the padding MISSING
# (evals/datasets/utils.eval_collate_fn_variable_time), and every timestep carries
# its own acquisition date from the raster metadata. Listing fixed layers instead
# would drop any window short of 36 and silently change the window set.
#
# TEN bands: the tessera_v2 fetch group these scenes come from carries only band sets
# 1-2, and rslearn cannot backfill a band set onto an already-materialized layer.
# Declaring ten is correct and sufficient -- the loader widens to the modality's
# canonical twelve and zeroes B01/B09 after normalization, matching pretraining's
# band dropout (RslearnToOlmoEarthDataset._init_band_scatter). Same compromise the
# ccmos pilot documents, and it means an all-scenes-vs-monthly delta bundles the
# temporal change with the loss of those two 60 m atmospheric bands.
#
# No scl input: the monthly sentinel2_scl_moNN layers describe mosaics this dataset
# no longer has. The scene layer carries its own per-acquisition SCL band set, so a
# cloud-masked sibling remains possible, but it would need a different mechanism
# than the loader's scl_cloud_mask and is deliberately not wired here.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/ethiopia_crops_s2all36_year_aligned
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel2_l2a_all
        load_all_layers: true
        load_all_item_groups: true
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo01
        - sentinel1_mo02
        - sentinel1_mo03
        - sentinel1_mo04
        - sentinel1_mo05
        - sentinel1_mo06
        - sentinel1_mo07
        - sentinel1_mo08
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
      landsat:
        data_type: raster
        dtype: FLOAT32
        layers:
        - landsat_mo01
        - landsat_mo02
        - landsat_mo03
        - landsat_mo04
        - landsat_mo05
        - landsat_mo06
        - landsat_mo07
        - landsat_mo08
        - landsat_mo09
        - landsat_mo10
        - landsat_mo11
        - landsat_mo12
        load_all_layers: true
        bands:
        - B8
        - B1
        - B2
        - B3
        - B4
        - B5
        - B6
        - B7
        - B9
        - B10
        - B11
        passthrough: true
        required: false
      landsat_qa:
        data_type: raster
        dtype: FLOAT32
        layers:
        - landsat_qa_mo01
        - landsat_qa_mo02
        - landsat_qa_mo03
        - landsat_qa_mo04
        - landsat_qa_mo05
        - landsat_qa_mo06
        - landsat_qa_mo07
        - landsat_qa_mo08
        - landsat_qa_mo09
        - landsat_qa_mo10
        - landsat_qa_mo11
        - landsat_qa_mo12
        load_all_layers: true
        bands:
        - QA_PIXEL
        passthrough: true
        required: false
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
        - gse
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      tessera_v2:
        data_type: raster
        dtype: FLOAT32
        layers:
        - tessera_v2
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        layers:
        - label_raster
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 4
              nodata_value: 255
              metric_kwargs:
                average: macro
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
    default_config:
      transforms:
      - class_path: rslearn.train.transforms.pad.Pad
        init_args:
          mode: center
          size: 32
          image_selectors:
          - sentinel2_l2a
          - landsat
          - sentinel1
          - target/eval_task/classes
          - target/eval_task/valid
          skip_missing: true
