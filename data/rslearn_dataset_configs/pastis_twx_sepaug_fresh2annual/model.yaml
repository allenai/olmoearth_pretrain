# Window-retrieval interchangeability dataset 'sepaug_fresh2annual': train-split windows hold fresh_sepaug,
# val/test windows hold annual2019 (an LP trained on fresh embeddings, scored on the other).
# Written by scripts/tools/window_retrieval_pastis_bake.py hybrid; config.json as pastis_tw_*.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis_twx_sepaug_fresh2annual
    inputs:
      olmoearth_emb:
        data_type: raster
        dtype: FLOAT32
        layers:
        - olmoearth_emb
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
        - label
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
