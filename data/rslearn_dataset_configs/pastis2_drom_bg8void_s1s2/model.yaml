# AUTO-GENERATED per-combo trim of pastis2_drom_bg8 for FT combo 's1s2'.
# Reads ONLY ['sentinel1', 'sentinel2_l2a', 'targets'] (drops unused gse/tessera_v2 + off-combo imagery)
# to cut per-window I/O, the FT dataloader bottleneck. See gen_percombo_configs.py.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/piperw/dev/rslearn_projects/pastis2/data/national_ds_monthly
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel2_l2a_mo01
        - sentinel2_l2a_mo02
        - sentinel2_l2a_mo03
        - sentinel2_l2a_mo04
        - sentinel2_l2a_mo05
        - sentinel2_l2a_mo06
        - sentinel2_l2a_mo07
        - sentinel2_l2a_mo08
        - sentinel2_l2a_mo09
        - sentinel2_l2a_mo10
        - sentinel2_l2a_mo11
        - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo01
        - sentinel1_mo02
        - sentinel1_mo03
        - sentinel1_mo04
        - sentinel1_mo05
        - sentinel1_mo06
        - sentinel1_mo07
        - sentinel1_mo08
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
        - label
        bands:
        - class_id
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        num_classes: 8
        nodata_value: 255
        class_id_mapping:
          0: 0
          1: 1
          12: 2
          16: 3
          19: 4
          20: 5
          21: 6
          23: 7
          2: 255
          3: 255
          4: 255
          5: 255
          6: 255
          7: 255
          8: 255
          9: 255
          10: 255
          11: 255
          13: 255
          14: 255
          15: 255
          17: 255
          18: 255
          22: 255
          24: 255
          25: 255
        enable_miou_metric: true
        enable_f1_metric: true
        report_metric_per_class: true
        class_names:
        - Background
        - Meadow
        - Fruits/vegetables/flowers
        - Orchard
        - Sugarcane
        - Banana
        - Pineapple
        - Tropical tuber
    batch_size: 8
    num_workers: 8
