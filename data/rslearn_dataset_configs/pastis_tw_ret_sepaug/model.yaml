# Window-retrieval eval variant 'ret_sepaug': 4/12 h(z_2018, Sep-Dec) + 8/12 h(z_2019, Jan-Aug): retrieved crop year.
# pastis_year_aligned windows/splits/labels + the variant's per-pixel embeddings as the
# olmoearth_emb layer, baked by scripts/tools/window_retrieval_pastis_bake.py. config.json is
# byte-identical to pastis_year_aligned_oe13zarr's, so its registry hash is known in advance.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis_tw_ret_sepaug
    inputs:
      olmoearth_emb:
        data_type: raster
        dtype: FLOAT32
        layers:
        - olmoearth_emb
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
        - label
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
