# pastis_year_aligned windows/splits/labels + OlmoEarth's published
# large-scale embeddings (olmoearth_emb), baked from the geozarr store by
# scripts/tools/bake_olmoearth_zarr_embeddings.py. config.json in this folder
# is copied byte-for-byte into the dataset root by that script, so its hash in
# the registry is known before the bake runs.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis_year_aligned_oe13zarr
    inputs:
      olmoearth_emb:
        data_type: raster
        dtype: FLOAT32
        layers:
        - olmoearth_emb
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
        - label
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
