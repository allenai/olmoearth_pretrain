# Loader config for scripts/tools/window_retrieval_pastis_bake.py: reads the S2, S1 and
# Landsat monthly layers (and labels) of any of the three PASTIS sources the window-retrieval
# eval embeds -- pastis_year_aligned (cal 2019), pastis_cal2018 (cal 2018) and
# pastis_sepaug (Sep 2018 - Aug 2019). The path is a placeholder; the bake passes
# each dataset's path as source_path. No embedding products are inputs, so windows are
# not filtered on gse / tessera layers.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis_year_aligned
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
          - sentinel2_l2a_mo06
          - sentinel2_l2a_mo07
          - sentinel2_l2a_mo08
          - sentinel2_l2a_mo09
          - sentinel2_l2a_mo10
          - sentinel2_l2a_mo11
          - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel1_mo01
          - sentinel1_mo02
          - sentinel1_mo03
          - sentinel1_mo04
          - sentinel1_mo05
          - sentinel1_mo06
          - sentinel1_mo07
          - sentinel1_mo08
          - sentinel1_mo09
          - sentinel1_mo10
          - sentinel1_mo11
          - sentinel1_mo12
        load_all_layers: true
        bands:
          - vv
          - vh
        passthrough: true
      landsat:
        data_type: raster
        dtype: FLOAT32
        layers:
        - landsat_mo01
        - landsat_mo02
        - landsat_mo03
        - landsat_mo04
        - landsat_mo05
        - landsat_mo06
        - landsat_mo07
        - landsat_mo08
        - landsat_mo09
        - landsat_mo10
        - landsat_mo11
        - landsat_mo12
        load_all_layers: true
        bands:
        - B8
        - B1
        - B2
        - B3
        - B4
        - B5
        - B6
        - B7
        - B9
        - B10
        - B11
        passthrough: true
        required: false
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # PASTIS: background (0) + 18 crop classes; 19 is the void label and
        # is masked to invalid (mapped to the segmentation ignore label by the
        # eval-time wrapper).
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
