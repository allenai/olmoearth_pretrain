# Eval-only model.yaml for olmoearth_pretrain registry ingestion.
# Fine-grained land cover (scripts/tools/build_fine_grained_eval_datasets.py):
# 32x32 windows around a 10x10 block of Geo-Wiki 10 m reference labels. Train
# windows carry the full block; val/test label only small (<= 10 px) fully
# observed components plus a capped sample of the pixels bordering them, so the
# score reflects recovering detail finer than the surrounding land cover.
# label_raster is nodata=255 elsewhere. Only the `data` block is consumed by
# ingest/eval.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/worldcover_fine_grained
    inputs:
      sentinel2_l2a:
        data_type: "raster"
        layers: ["sentinel2", "sentinel2.1", "sentinel2.2", "sentinel2.3", "sentinel2.4", "sentinel2.5", "sentinel2.6", "sentinel2.7", "sentinel2.8", "sentinel2.9", "sentinel2.10", "sentinel2.11"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        load_all_layers: true
        load_all_item_groups: false
      targets:
        data_type: "raster"
        layers: ["label_raster"]
        bands: ["label"]
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              # bare, crops, fallow/shifting cultivation, grassland, shrub,
              # tree, urban/built-up, water, wetland (herbaceous)
              num_classes: 9
              nodata_value: 255
              enable_miou_metric: true
        input_mapping:
          eval_task:
            targets: "targets"
    batch_size: 8
    num_workers: 16
