# PASTIS changed-year benchmark: trains on the pastis_rslearn 2019 train/val folds (symlinked) and tests on the
# same places re-imaged in a year when their crop changed (group "changed"), plus the 2019 test fold as reference.
# Built by /weka/dfive-default/agent/piperbots/2026-10-28-rpg-history/pastis_changed/build_dataset.py.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/agent/piperbots/2026-10-28-rpg-history/pastis_changed/dataset
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
          - sentinel2_l2a_mo06
          - sentinel2_l2a_mo07
          - sentinel2_l2a_mo08
          - sentinel2_l2a_mo09
          - sentinel2_l2a_mo10
          - sentinel2_l2a_mo11
          - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # PASTIS: background (0) + 18 crop classes; 19 is the void label and
        # is masked to invalid (mapped to the segmentation ignore label by the
        # eval-time wrapper).
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
