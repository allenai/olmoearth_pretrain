# NISAR OSM S1+NISAR eval building (card t-grl7q6, favyen 2026-11-10; PLAN_LP_S1_NISAR.md and
# nisar_osm_evals/bin/make_s1nisar_yamls.py in /weka/dfive-default/agent/favyen/2026-10-27-favyen-nisar-naip-pretrain).
# 64x64 crops at 10 m of held-out osm_sampling tiles; label: OSM building.
# Input: S1 vv/vh (required) + NISAR asc and desc HH/HV (each optional, fed when all 4 months exist); layers mo09-mo12 (2026-06-17..10-15, the osm_recent periods).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/helios/dataset_creation/nisar_osm_evals/s1nisar_building
    inputs:
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
        required: true
      nisar_asc:
        data_type: raster
        dtype: FLOAT32
        layers:
        - nisar_asc_mo09
        - nisar_asc_mo10
        - nisar_asc_mo11
        - nisar_asc_mo12
        load_all_layers: true
        bands:
        - HHHH
        - HVHV
        passthrough: true
        required: false
      nisar_desc:
        data_type: raster
        dtype: FLOAT32
        layers:
        - nisar_desc_mo09
        - nisar_desc_mo10
        - nisar_desc_mo11
        - nisar_desc_mo12
        load_all_layers: true
        bands:
        - HHHH
        - HVHV
        passthrough: true
        required: false
      targets:
        data_type: raster
        layers:
        - label_raster
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 2
              nodata_value: 255
              metric_kwargs:
                average: macro
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
