# Hand-written sibling of ethiopia_crops_year_aligned. NOT generated -- do not add
# this dataset to build_year_aligned_eval_configs.DATASETS, which rebuilds the
# sentinel2_l2a input unconditionally from MONTHLY_LAYERS and would reset it.
#
# Same windows, labels and eval_split tags as the parent (rsync'd, so identical by
# construction), same gse/tessera_v2 embedding layers, same S1/Landsat. The ONE
# difference is the S2 imagery: each sentinel2_l2a_moNN layer is a per-pixel
# cloud-aware composite built by
# olmoearth_pretrain/evals/datasets/pixel_mosaic_export.py, which for every 30-day
# period selects, per pixel, the acquisition with the least-contaminated SCL class.
# Measured 93.3% of chosen pixels clear, against the parent's scene-level
# `sort_by: eo:cloud_cover` mosaic.
#
# TEN bands: the tessera_v2 fetch group this was built from carries only band sets
# 1-2, and rslearn cannot backfill a band set onto an already-materialized layer.
# Declaring ten is correct and sufficient -- the loader widens to the modality's
# canonical twelve and zeroes B01/B09 after normalization, matching pretraining's
# band dropout (RslearnToOlmoEarthDataset._init_band_scatter). The ten are also
# exactly Tessera's own input set (tessera_v2_model.S2_BAND_ORDER), so this arm is
# band-matched to Tessera.
#
# The stored bands are one band set at window resolution, not the parent's
# 10m/20m/40m trio: _read_scenes returns everything on the window grid, so the
# bilinear upsample happens at export instead of at load.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/ethiopia_crops_ccmos_year_aligned
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel2_l2a_mo01
        - sentinel2_l2a_mo02
        - sentinel2_l2a_mo03
        - sentinel2_l2a_mo04
        - sentinel2_l2a_mo05
        - sentinel2_l2a_mo06
        - sentinel2_l2a_mo07
        - sentinel2_l2a_mo08
        - sentinel2_l2a_mo09
        - sentinel2_l2a_mo10
        - sentinel2_l2a_mo11
        - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo01
        - sentinel1_mo02
        - sentinel1_mo03
        - sentinel1_mo04
        - sentinel1_mo05
        - sentinel1_mo06
        - sentinel1_mo07
        - sentinel1_mo08
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
      landsat:
        data_type: raster
        dtype: FLOAT32
        layers:
        - landsat_mo01
        - landsat_mo02
        - landsat_mo03
        - landsat_mo04
        - landsat_mo05
        - landsat_mo06
        - landsat_mo07
        - landsat_mo08
        - landsat_mo09
        - landsat_mo10
        - landsat_mo11
        - landsat_mo12
        load_all_layers: true
        bands:
        - B8
        - B1
        - B2
        - B3
        - B4
        - B5
        - B6
        - B7
        - B9
        - B10
        - B11
        passthrough: true
        required: false
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
        - gse
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      tessera_v2:
        data_type: raster
        dtype: FLOAT32
        layers:
        - tessera_v2
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      targets:
        data_type: raster
        layers:
        - label_raster
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 4
              nodata_value: 255
              metric_kwargs:
                average: macro
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
    default_config:
      transforms:
      - class_path: rslearn.train.transforms.pad.Pad
        init_args:
          mode: center
          size: 32
          image_selectors:
          - sentinel2_l2a
          - landsat
          - sentinel1
          - target/eval_task/classes
          - target/eval_task/valid
          skip_missing: true
