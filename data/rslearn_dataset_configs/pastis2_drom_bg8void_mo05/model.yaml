# AUTO-GENERATED temporal-ablation arm of pastis2_drom_bg8void: first 5 monthly S2
# mosaics (mo01..mo05), later months dropped.
# Generated by gen_temporal_ablation.py -- edit that, not this.
# Model/task config for the PASTIS2 (France-DROM) eval dataset — the 12-monthly
# -mosaic twin at data/national_ds_monthly (see pastis2/config_monthly.json and
# make_monthly_windows.py). Mirrors data/rslearn_dataset_configs/pastis_rslearn/
# model.yaml, adapted for PASTIS2: 26 classes (PASTIS-18 + 7 tropical DROM incl.
# coffee=25), the class_id label band, and the DROM dataset path. Only the `data`
# block is read by studio_ingest / the eval-time rslearn_builder. Band orders
# match the OlmoEarth modality band_order so the eval normalizer sees the
# expected channels.
#
# To use with the olmoearth eval framework, place a copy at
#   olmoearth_pretrain/data/rslearn_dataset_configs/pastis2_drom/model.yaml
# and register the dataset via studio_ingest (see README / eval notes).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/piperw/dev/rslearn_projects/pastis2/data/national_ds_monthly
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
        load_all_layers: true
        # OlmoEarth S2 band order (matches pastis_rslearn); our mo layers carry
        # the same 3 zoom-tiered band-sets (B02-04,B08 / B05-07,B8A,B11,B12 / B01,B09).
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel1_mo01
          - sentinel1_mo02
          - sentinel1_mo03
          - sentinel1_mo04
          - sentinel1_mo05
          - sentinel1_mo06
          - sentinel1_mo07
          - sentinel1_mo08
          - sentinel1_mo09
          - sentinel1_mo10
          - sentinel1_mo11
          - sentinel1_mo12
        load_all_layers: true
        bands:
          - vv
          - vh
        passthrough: true
      # AEF (Google Satellite Embedding V1), 2019 annual embedding, single slot,
      # materialized into national_ds_monthly as the `aef` layer (64-band). The
      # olmoearth GSE modality is keyed `gse`, so this input is named `gse` but
      # reads our `aef` layer. Enables `--model=aef` on PASTIS2 with the SAME
      # splits as the OlmoEarth imagery eval.
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
          - aef
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      # Tessera v2 (large student) 128-d embedding, inferred per window into the
      # `tessera_v2` layer by pastis_tessera_v2.py. Named `tessera_v2` (the OlmoEarth
      # TESSERA_V2 modality key). Enables `--model=tessera_v2_precomputed` on PASTIS2
      # with the SAME splits as the OlmoEarth imagery / AEF evals. required: false so
      # it doesn't gate the imagery evals.
      tessera_v2:
        data_type: raster
        dtype: FLOAT32
        layers:
          - tessera_v2
        required: false
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      # Landsat 8/9 OLI-TIRS monthly mosaics (aws_landsat), 12 slots. required:
      # false so S2/S1-only evals run before landsat is materialized (the eval
      # loader supports ragged/optional Landsat). Band order = Modality.LANDSAT.
      landsat:
        data_type: raster
        dtype: FLOAT32
        layers:
          - landsat_mo01
          - landsat_mo02
          - landsat_mo03
          - landsat_mo04
          - landsat_mo05
          - landsat_mo06
          - landsat_mo07
          - landsat_mo08
          - landsat_mo09
          - landsat_mo10
          - landsat_mo11
          - landsat_mo12
        load_all_layers: true
        required: false
        bands:
          - B8
          - B1
          - B2
          - B3
          - B4
          - B5
          - B6
          - B7
          - B9
          - B10
          - B11
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - class_id
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # PASTIS2-DROM "bg8void" taxonomy: same 8 trained classes as bg8, but every
        # EXCLUDED crop maps to 255 (void) so it is masked out of the loss and the
        # metrics rather than taught as non-agricultural land. Background(0) stays a
        # real, trained semantic class - the PASTIS convention (background = land
        # cover, void = invalid data). 92,145 px across 2750 DROM windows, 0.25% of
        # Background: Corn 10,781  Grapevine 174  Beet 10  Potatoes 9,990
        # LegFodder 181  Soybeans 4  Vanilla 39,635  Ylang 9,967  Coffee/Cacao 21,403.
        num_classes: 8
        nodata_value: 255
        class_id_mapping:
          0: 0
          1: 1
          12: 2
          16: 3
          19: 4
          20: 5
          21: 6
          23: 7
          2: 255
          3: 255
          4: 255
          5: 255
          6: 255
          7: 255
          8: 255
          9: 255
          10: 255
          11: 255
          13: 255
          14: 255
          15: 255
          17: 255
          18: 255
          22: 255
          24: 255
          25: 255
        enable_miou_metric: true
        enable_f1_metric: true
        report_metric_per_class: true
        class_names:
          - "Background"
          - "Meadow"
          - "Fruits/vegetables/flowers"
          - "Orchard"
          - "Sugarcane"
          - "Banana"
          - "Pineapple"
          - "Tropical tuber"
    batch_size: 8
    num_workers: 4
