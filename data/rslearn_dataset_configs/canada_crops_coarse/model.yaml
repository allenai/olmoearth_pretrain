# Eval-only model.yaml for olmoearth_pretrain registry ingestion.
# AEF-style task: each window has a single labeled center pixel (label_raster,
# nodata=255 elsewhere). Only the `data` block is consumed by ingest/eval.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/rslearn-eai/datasets/olmoearth_evals/canada_crops_coarse/
    inputs:
      gse:
        data_type: raster
        dtype: FLOAT32
        layers:
          - gse
        required: true
        use_all_bands_in_order_of_band_set_idx: 0
        passthrough: true
      sentinel2_l2a:
        data_type: "raster"
        layers: ["sentinel2", "sentinel2.1", "sentinel2.2", "sentinel2.3", "sentinel2.4", "sentinel2.5", "sentinel2.6", "sentinel2.7", "sentinel2.8", "sentinel2.9", "sentinel2.10", "sentinel2.11"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        load_all_layers: true
        load_all_item_groups: false
      targets:
        data_type: "raster"
        layers: ["label_raster"]
        bands: ["label"]
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              # Agr. - Oilseeds, Agr. - Forages, Agr. - Fruits (Berry & Annual),
              # Agr. - Cereals, Agr. - Vegetables, Non-Agr., Agr. - Pulses,
              # Agr. - Fruits (Trees), Agr. - Others
              num_classes: 9
              nodata_value: 255
              metric_kwargs:
                average: "macro"
        input_mapping:
          eval_task:
            targets: "targets"
    batch_size: 8
    num_workers: 16
    default_config:
      transforms:
        - class_path: rslearn.train.transforms.pad.Pad
          init_args:
            mode: "center"
            size: 32
            image_selectors: ["sentinel2_l2a", "target/eval_task/classes", "target/eval_task/valid"]
