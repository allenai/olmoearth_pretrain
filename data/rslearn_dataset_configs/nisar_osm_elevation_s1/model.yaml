# NISAR OSM S1+NISAR eval elevation (card t-grl7q6, favyen 2026-11-10; PLAN_LP_S1_NISAR.md and
# nisar_osm_evals/bin/make_s1nisar_yamls.py in /weka/dfive-default/agent/favyen/2026-10-27-favyen-nisar-naip-pretrain).
# 64x64 crops at 10 m of held-out osm_sampling tiles; label: SRTM elevation (m, the osm_sampling tile's srtm layer = pretraining SRTM).
# Input: S1 vv/vh only (same windows as the _s1nisar dataset); layers mo09-mo12 (2026-06-17..10-15, the osm_recent periods).
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/helios/dataset_creation/nisar_osm_evals/s1nisar_elevation
    inputs:
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
        - sentinel1_mo09
        - sentinel1_mo10
        - sentinel1_mo11
        - sentinel1_mo12
        load_all_layers: true
        bands:
        - vv
        - vh
        passthrough: true
        required: true
      targets:
        data_type: raster
        dtype: FLOAT32
        layers:
        - srtm_label
        bands:
        - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          eval_task:
            class_path: rslearn.train.tasks.per_pixel_regression.PerPixelRegressionTask
            init_args:
              nodata_value: -9999
        input_mapping:
          eval_task:
            targets: targets
    batch_size: 8
    num_workers: 16
