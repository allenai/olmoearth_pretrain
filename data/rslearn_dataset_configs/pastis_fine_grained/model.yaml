# Canonical model/task config for the pastis_fine_grained eval dataset
# (scripts/tools/build_fine_grained_eval_datasets.py): the pastis_rslearn
# windows and splits, S2 + S1 only. Train labels are unchanged; val/test label
# only crop parcels of <= 50 px (PASTIS-R ParcelIDs) that lie inside the patch,
# plus a capped sample of the pixels bordering them; everything else is void
# (19). Only the `data` block is read.
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: /weka/dfive-default/olmoearth/eval_datasets/pastis_fine_grained
    inputs:
      sentinel2_l2a:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel2_l2a_mo01
          - sentinel2_l2a_mo02
          - sentinel2_l2a_mo03
          - sentinel2_l2a_mo04
          - sentinel2_l2a_mo05
          - sentinel2_l2a_mo06
          - sentinel2_l2a_mo07
          - sentinel2_l2a_mo08
          - sentinel2_l2a_mo09
          - sentinel2_l2a_mo10
          - sentinel2_l2a_mo11
          - sentinel2_l2a_mo12
        load_all_layers: true
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
      sentinel1:
        data_type: raster
        dtype: FLOAT32
        layers:
          - sentinel1_mo01
          - sentinel1_mo02
          - sentinel1_mo03
          - sentinel1_mo04
          - sentinel1_mo05
          - sentinel1_mo06
          - sentinel1_mo07
          - sentinel1_mo08
          - sentinel1_mo09
          - sentinel1_mo10
          - sentinel1_mo11
          - sentinel1_mo12
        load_all_layers: true
        bands:
          - vv
          - vh
        passthrough: true
      targets:
        data_type: raster
        dtype: INT32
        layers:
          - label
        bands:
          - label
        is_target: true
    task:
      class_path: rslearn.train.tasks.segmentation.SegmentationTask
      init_args:
        # PASTIS: background (0) + 18 crop classes; 19 is the void label and
        # is masked to invalid (mapped to the segmentation ignore label by the
        # eval-time wrapper).
        num_classes: 19
        nodata_value: 19
        enable_miou_metric: true
    batch_size: 8
    num_workers: 4
